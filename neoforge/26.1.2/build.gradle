plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = rootProject.file('../../VERSION').text.trim()
group = 'com.miyabi'
base { archivesName = 'fortune_touch_switch-neoforge-26.1.2' }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8' }

sourceSets.main.java.srcDirs = ['../../shared/common/java', '../../shared/neo/java', '../../shared/glint26/java', '../../shared/glint26tex_blaze/java', '../../shared/glintstorage/java', '../../shared/glint261/java']
sourceSets.main.resources.srcDirs = ['../../shared/res', '../../shared/glint261/resources']
sourceSets.main.java.exclude '**/mixin/ItemSubmitMixin.java'

neoForge {
    enable {
        version = '26.1.2.126'
        disableRecompilation = true
    }
}

processResources {
    def p = [version: project.version, mc: '26.1.2', neo_min: '26.1.2']
    inputs.properties p
    from('../../shared') { include 'LICENSE' }
    from('../../shared') { include 'neoforge-glint.mods.toml'; rename { 'neoforge.mods.toml' }; into 'META-INF'; expand p }
}
