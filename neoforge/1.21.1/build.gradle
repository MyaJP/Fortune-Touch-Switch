plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = rootProject.file('../../VERSION').text.trim()
group = 'com.miyabi'
base { archivesName = 'fortune_touch_switch-neoforge-1.21.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { it.options.encoding = 'UTF-8' }

sourceSets.main.java.srcDirs = ['../../shared/common/java', '../../shared/neo/java', '../../shared/neo1211client/java']
sourceSets.main.resources.srcDirs = ['../../shared/res', '../../shared/neo1211client/resources']

neoForge {
    enable {
        version = '21.1.262'
        disableRecompilation = true
    }
}

processResources {
    def p = [version: project.version, mc: '1.21.1', neo_min: '21.1']
    inputs.properties p
    from('../../shared') { include 'LICENSE' }
    from('../../shared') { include 'neoforge-glint.mods.toml'; rename { 'neoforge.mods.toml' }; into 'META-INF'; expand p }
}
