plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = rootProject.file('../../VERSION').text.trim()
group = 'com.miyabi'
base { archivesName = 'fortune_touch_switch-fabric-1.21.11' }

sourceSets.main.java.srcDirs = ['../../shared/common/java', '../../shared/fab12111/java', '../../shared/glint26/java', '../../shared/glint26tex_blaze/java', '../../shared/glintstorage/java', '../../shared/glint26111/java']
sourceSets.main.resources.srcDirs = ['../../shared/res', '../../shared/glint26111/resources']
sourceSets.main.java.exclude '**/mixin/ItemSubmitMixin.java'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }

processResources {
    def p = [version: project.version, mc: '1.21.11', java: '21', loader_min: '0.16.0']
    inputs.properties p
    from('../../shared') { include 'LICENSE' }
    from('../../shared') { include 'fabric-glint.mod.json'; rename { 'fabric.mod.json' }; expand p }
}
