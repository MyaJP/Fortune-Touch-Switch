plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = rootProject.file('../../VERSION').text.trim()
group = 'com.miyabi'
base { archivesName = 'fortune_touch_switch-fabric-26.3' }

sourceSets.main.java.srcDirs = ['../../shared/common/java', '../../shared/fab12111/java', '../../shared/glint26/java', '../../shared/glint26tex_pearl/java', '../../shared/glint263/java']
sourceSets.main.resources.srcDirs = ['../../shared/res', '../../shared/glint26/resources']

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }

processResources {
    def p = [version: project.version, mc: '26.3', java: '25', loader_min: '0.18.4']
    inputs.properties p
    from('../../shared') { include 'LICENSE' }
    from('../../shared') { include 'fabric-glint.mod.json'; rename { 'fabric.mod.json' }; expand p }
}
